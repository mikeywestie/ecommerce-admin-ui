name: React CI

on:
  push:
    branches:
      - dev
      - develop
      - main
      - "feat/**"
      - "feature/**"
      - "fix/**"

  pull_request:
    branches:
      - dev
      - develop
      - main

jobs:
  build:
    name: Format, Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
